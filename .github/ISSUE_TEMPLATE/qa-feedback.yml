name: QA feedback
description: Report an installation problem, missed check, incorrect verdict or useful scenario.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Share a small, reproducible case with synthetic or redacted data.
        Do not upload tokens, cookies, .env files, raw chat exports, production logs, client data or private URLs.
        For vulnerabilities in Outcome QA itself, use SECURITY.md and a private reporting channel.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Installation or discovery
        - Missed or weak check
        - Incorrect verdict
        - Useful new scenario
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Outcome QA version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Host, model, OS and relevant tools
      description: Include versions where known. Use unknown rather than guessing.
      placeholder: "Host/version: ...
Model: ...
OS: ...
Relevant tool/version: ..."
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation route
      options:
        - Codex marketplace plugin
        - Claude Code marketplace plugin
        - Claude Code plugin-dir
        - Standalone skills
        - Exported playbook
        - Optional reviewer
        - Source checkout
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Redacted task and requirement
      description: State the task and the requirement, contract or baseline that defines the expected behavior. Do not paste the entire conversation.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual result
      description: Include the exact redacted error or conclusion and explain the difference.
      placeholder: "Expected: ...
Actual: ..."
    validations:
      required: true
  - type: input
    id: loaded_method
    attributes:
      label: Skill or reviewer actually loaded
      description: Use observed skill-file reads or agent-start events if available; otherwise write unknown.
      placeholder: "oq-explore; observed skills/oq-explore/SKILL.md read, or unknown"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give synthetic inputs, initial state, actions and result. For intermittent behavior, include attempt counts and differences.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional minimal excerpt or synthetic artifact. Do not attach raw production material or private chat histories.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and attachments for secrets, private identifiers and client data.
          required: true
